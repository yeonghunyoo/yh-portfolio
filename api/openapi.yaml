openapi: 3.1.0
info:
  title: yh_portfolio views API
  version: 1.0.0
  description: |
    Minimal backend for the yh_portfolio site. The only concern in this cycle is a public,
    per-page view counter (increment + read). Served by Astro server endpoints on Vercel,
    backed by Upstash Redis (env: VIEWS_STORE_URL, VIEWS_STORE_TOKEN — placeholders only).
    No authentication: counters are public aggregates and the design has no login screen.
    Page keys are slugs, one per screen in design/handoff.manifest.json:
    `resume` (the resume index, path "/"), `forest` (the Forest case study) and
    `handoff-agent` (the Handoff Agent case study).
servers:
  - url: /api
    description: Same-origin Astro endpoints (relative to the deployed site)
tags:
  - name: views
    description: Per-page view counters
paths:
  /views:
    get:
      tags: [views]
      operationId: listPageViews
      summary: List all page view counters
      description: Returns every known page slug with its current count. Order is unspecified.
      responses:
        '200':
          description: All counters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageViewsList'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
  /views/{page}:
    parameters:
      - $ref: '#/components/parameters/PageSlug'
    get:
      tags: [views]
      operationId: getPageViews
      summary: Read the view count of one page
      description: Returns 0 for a page that has never been viewed (never 404).
      responses:
        '200':
          description: Current count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageViews'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
    post:
      tags: [views]
      operationId: incrementPageViews
      summary: Increment the view count of one page
      description: |
        Atomically increments the counter by 1 (Redis INCR) and returns the new value.
        Called once per page load from the client; no request body. Idempotency is not
        required — repeated calls count repeated views.
      responses:
        '200':
          description: Count after the increment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageViews'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Too many increments from one client in a short window
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/StoreUnavailable'
components:
  parameters:
    PageSlug:
      name: page
      in: path
      required: true
      description: Page slug. Lowercase letters, digits and hyphens, 1–64 chars.
      schema:
        $ref: '#/components/schemas/PageSlug'
      examples:
        resume:
          value: resume
        forest:
          value: forest
        handoffAgent:
          value: handoff-agent
  schemas:
    PageSlug:
      type: string
      pattern: '^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$'
      minLength: 1
      maxLength: 64
      examples: [resume, forest, handoff-agent]
    PageViews:
      type: object
      required: [page, views]
      properties:
        page:
          $ref: '#/components/schemas/PageSlug'
        views:
          type: integer
          format: int64
          minimum: 0
          description: Total recorded views for the page
      examples:
        - page: handoff-agent
          views: 128
    PageViewsList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PageViews'
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [invalid_page, rate_limited, store_unavailable]
        message:
          type: string
  responses:
    BadRequest:
      description: The page slug does not match the allowed pattern
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: invalid_page
            message: page must match ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$
    StoreUnavailable:
      description: The counter store (Upstash Redis) is unreachable or not configured
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: store_unavailable
            message: views store unavailable
